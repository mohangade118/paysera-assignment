framework:
    rate_limiter:
        # Baseline limiter for all /api endpoints (per authenticated user or IP)
        api_global:
            policy: 'token_bucket'
            limit: 60
            rate:
                interval: '1 minute'
                amount: 60

        # Stricter limiter for money-moving transaction endpoint
        api_transaction_post:
            policy: 'token_bucket'
            limit: 5
            rate:
                interval: '1 minute'
                amount: 10

        api_test_email_post:
            policy: 'token_bucket'
            limit: 10
            rate:
                interval: '1 minute'
                amount: 20

when@test:
    framework:
        rate_limiter:
            api_global:
                policy: 'token_bucket'
                limit: 100000
                rate:
                    interval: '1 minute'
                    amount: 100000
            api_transaction_post:
                policy: 'token_bucket'
                limit: 100000
                rate:
                    interval: '1 minute'
                    amount: 100000
            api_test_email_post:
                policy: 'token_bucket'
                limit: 100000
                rate:
                    interval: '1 minute'
                    amount: 100000