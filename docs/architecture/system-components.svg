<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Paysera Fund Transfer API - System Components</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="bold">Paysera Fund Transfer API - System Components</text>

  <rect x="480" y="45" width="160" height="44" rx="6" fill="#f5f5f5" stroke="#666"/>
  <text x="560" y="72" text-anchor="middle" font-weight="bold">HTTP Client</text>

  <rect x="30" y="110" width="1140" height="580" rx="4" fill="#dae8fc" fill-opacity="0.25" stroke="#6c8ebf" stroke-width="2"/>
  <text x="50" y="135" font-weight="bold" fill="#6c8ebf">Docker Compose Stack</text>

  <rect x="50" y="150" width="1100" height="70" rx="4" fill="#e1d5e7" fill-opacity="0.4" stroke="#9673a6"/>
  <text x="70" y="172" font-weight="bold" fill="#9673a6">Edge Layer</text>
  <rect x="500" y="175" width="120" height="36" fill="#fff2cc" stroke="#d6b656"/>
  <text x="560" y="198" text-anchor="middle">nginx :8080</text>

  <rect x="50" y="240" width="680" height="300" rx="4" fill="#d5e8d4" fill-opacity="0.4" stroke="#82b366"/>
  <text x="70" y="262" font-weight="bold" fill="#82b366">Symfony Application - PHP 8.3 FPM</text>

  <rect x="80" y="280" width="130" height="36" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="145" y="303" text-anchor="middle">Event Subscribers</text>
  <rect x="280" y="280" width="140" height="36" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="350" y="303" text-anchor="middle" font-weight="bold">API Controllers</text>
  <rect x="80" y="340" width="120" height="32" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="140" y="360" text-anchor="middle">DTO and Validator</text>
  <rect x="260" y="340" width="110" height="32" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="315" y="360" text-anchor="middle">JWT Security</text>
  <rect x="450" y="330" width="150" height="40" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="525" y="355" text-anchor="middle" font-weight="bold">TransactionService</text>
  <rect x="80" y="410" width="120" height="32" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="140" y="430" text-anchor="middle">Symfony Cache</text>
  <rect x="260" y="410" width="140" height="32" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="330" y="430" text-anchor="middle">Symfony Messenger</text>
  <rect x="480" y="410" width="90" height="32" rx="6" fill="#fff" stroke="#82b366"/>
  <text x="525" y="430" text-anchor="middle">Mailer</text>

  <rect x="760" y="240" width="380" height="140" rx="4" fill="#ffe6cc" fill-opacity="0.4" stroke="#d79b00"/>
  <text x="780" y="262" font-weight="bold" fill="#d79b00">Data and Messaging</text>
  <ellipse cx="820" cy="320" rx="50" ry="28" fill="#fff" stroke="#d79b00"/>
  <text x="820" y="325" text-anchor="middle">MySQL 8</text>
  <ellipse cx="950" cy="320" rx="45" ry="28" fill="#fff" stroke="#d79b00"/>
  <text x="950" y="325" text-anchor="middle">Redis</text>
  <path d="M1040 295 L1100 295 L1130 320 L1100 345 L1040 345 Z" fill="#fff" stroke="#d79b00"/>
