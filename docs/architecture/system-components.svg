  <text x="910" y="442" text-anchor="middle" font-weight="bold">Messenger Consumer</text>
  <text x="910" y="458" text-anchor="middle" font-size="11">(async worker)</text>

  <line x1="560" y1="89" x2="560" y2="175" stroke="#333" marker-end="url(#arrow)"/>
  <text x="575" y="135" font-size="11">HTTP</text>

  <line x1="560" y1="211" x2="350" y2="280" stroke="#333" marker-end="url(#arrow)"/>
