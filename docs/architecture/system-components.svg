  <line x1="200" y1="426" x2="905" y2="320" stroke="#333" marker-end="url(#arrow)"/>
  <text x="520" y="400" font-size="11">cache.app</text>

  <line x1="525" y1="442" x2="400" y2="442" stroke="#333" marker-end="url(#arrow)"/>
  <text x="450" y="435" font-size="9">TransactionSucceededMessage</text>

  <line x1="400" y1="442" x2="1040" y2="330" stroke="#333" marker-end="url(#arrow)"/>
  <text x="680" y="380" font-size="11">AMQP</text>

  <line x1="1085" y1="345" x2="910" y2="420" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="910" y1="468" x2="525" y2="426" stroke="#333" marker-end="url(#arrow)"/>

  <line x1="860" y1="444" x2="820" y2="348" stroke="#333" marker-end="url(#arrow)"/>
  <text x="800" y="400" font-size="11">notifications</text>
</svg>
